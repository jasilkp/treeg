name: Keep Render Alive

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Render Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive HTTP request
        run: |
          echo "Sending keep-alive request to Render..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "https://ableinfra-jxiz.onrender.com/health/")
          echo "Render responded with HTTP status: $RESPONSE"
